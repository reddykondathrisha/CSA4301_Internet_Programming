<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 70px auto;
            grid-template-areas:
                "sidebar header"
                "sidebar main";
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #263238;
            color: white;
            padding: 25px;
        }

        .sidebar h2 {
            margin-bottom: 25px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .sidebar li:hover {
            background-color: #455a64;
        }

        .main-content {
            grid-area: main;
            padding: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .card p {
            font-size: 26px;
            color: #1976d2;
            font-weight: bold;
        }

        @media screen and (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main";
            }

            .sidebar ul {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header class="header">
        <h1>Admin Dashboard</h1>
    </header>

    <aside class="sidebar">
        <h2>Menu</h2>

        <ul>
            <li>Dashboard</li>
            <li>Users</li>
            <li>Orders</li>
            <li>Reports</li>
            <li>Settings</li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Total Sales</h3>
                <p>₹85,000</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p>320</p>
            </div>

            <div class="card">
                <h3>Pending Orders</h3>
                <p>25</p>
            </div>

        </div>
    </main>

</div>

</body>
</html>
